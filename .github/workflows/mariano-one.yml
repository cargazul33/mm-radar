name: Mariano One Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mariano-one.yml'
      - 'mariano-one/scripts/**'
      - 'mariano-one/index.html'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install scanner dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Scan public official sources
        run: python mariano-one/scripts/scan_public.py
      - name: Persist verified radar data
        run: |
          if git diff --quiet -- mariano-one/data/opportunities.json; then
            echo "No data changes"
          else
            git config user.name "mariano-one-bot"
            git config user.email "actions@users.noreply.github.com"
            git add mariano-one/data/opportunities.json
            git commit -m "chore: update Mariano One radar"
            git push
          fi
