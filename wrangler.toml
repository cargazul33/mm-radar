name = "mm-radar"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "mm-radar-db"
database_id = "00000000-0000-0000-0000-000000000001"
preview_database_id = "local-mm-radar-db"

[vars]
MARKUP_DEFAULT = "1.90"
META_VENTAS_MENSUAL = "40000000"
META_GANANCIA_MENSUAL = "10000000"
HARD_SKIP_CODINEU = "16514"
APP_TZ = "America/Argentina/Buenos_Aires"
